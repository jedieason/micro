<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>臺大玻片跑臺機</title><link rel="icon" type="image/png" href="../icons/icon-32.png"><link rel="stylesheet" href="style.css"></head>
<body><header><div><strong>臺大玻片跑臺機</strong></div></header>
<main><nav><button id="bankTab" class="tab active">選題</button><button id="examTab" class="tab">作答</button><button id="historyTab" class="tab">紀錄</button></nav><p id="notice" role="status" aria-live="polite"></p>
<section id="bankView"><section class="sync"><div class="row"><strong id="syncTitle">正在連接原站…</strong><button id="sync" class="text">重新讀取</button></div><p id="syncDetail" class="small muted"></p><button id="showAll" class="secondary" hidden>在原站顯示 All 並讀取</button><button id="openSite" class="secondary" hidden>開啟台大玻片系統</button></section>
<details class="unit-picker"><summary>依單元選題</summary><div id="units"></div><div class="row"><button id="addUnits" class="secondary">加入列表</button><button id="replaceUnits" class="text">取代列表</button></div></details>
<div class="row heading"><h2>已加入 <span id="total" class="badge">0</span></h2><button id="new" class="text">＋ 手動新增</button></div><button id="clearSelection" class="text">清除所有已選擇</button><input id="search" type="search" aria-label="搜尋題目" placeholder="搜尋代號、器官或診斷">
<details class="import"><summary>輸入代號選題</summary><textarea id="codes" rows="2" aria-label="玻片代號" placeholder="PA0001, PA0002 或 PA0041–PA0060"></textarea><div class="row"><button id="addCodes" class="secondary">加入選取</button><button id="replaceCodes" class="text">取代選取</button></div><p id="pending" class="small muted"></p></details>
<label class="check" hidden><input id="selectAll" type="checkbox"> 全選篩選結果</label><div id="rows" class="slides"></div><p id="empty" class="empty">點玻片旁的 ＋ 加入題目。</p>
<div class="start"><p id="selectionSummary" class="small muted"></p><div class="row"><label for="count">題數</label><input id="count" type="number" min="1" value="10"><button id="allQuestions" class="text" type="button" aria-pressed="false">全部</button><button id="start" class="primary">開始練習 →</button></div></div></section>
<section id="examView" hidden><div id="question"></div></section>
<section id="historyView" hidden><div class="row heading"><h2>練習紀錄</h2><button id="export" class="text">匯出</button><button id="clear" class="text">清除</button></div><div id="history"></div></section>
</main>
<footer>Made by <a href="https://instagram.com/jedieason" target="_blank" rel="noopener noreferrer">Jedieason</a></footer>
<dialog id="editor"><form id="editForm"><div class="row"><h2 id="editTitle">玻片答案</h2><button type="button" id="closeEditor" class="text">關閉</button></div><label for="editCode">玻片代號</label><input id="editCode" required><label for="editURL">原站完整玻片連結</label><input id="editURL" type="url" required><label for="editOrgan">Organ</label><input id="editOrgan" required><label for="editDiagnosis">Diagnosis</label><input id="editDiagnosis" required><details><summary>同義答案（每行一個）</summary><label for="organAliases">Organ</label><textarea id="organAliases" rows="2"></textarea><label for="diagnosisAliases">Diagnosis</label><textarea id="diagnosisAliases" rows="2"></textarea></details><label for="source">網站原文</label><textarea id="source" rows="4"></textarea><label class="check"><input id="confirmed" type="checkbox" required> 已確認答案</label><p id="editError" role="alert"></p><button class="primary wide" type="submit">儲存</button></form></dialog>
<dialog id="clearDialog"><form id="clearForm" method="dialog"><div class="row"><h2>清除練習紀錄</h2><button type="button" id="closeClearDialog" class="text">關閉</button></div><p class="muted">確定要清除所有練習紀錄嗎？此動作無法復原。</p><div class="row" style="justify-content:flex-end;margin-top:16px"><button type="button" id="cancelClear" class="secondary">取消</button><button type="submit" id="confirmClear" class="primary">確定清除</button></div></form></dialog>
<script type="module" src="app.js"></script></body></html>
